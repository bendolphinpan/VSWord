<svg id="ID" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 62"  role="graphics-document document" aria-roledescription="packet"><style>#ID{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#ID .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#ID .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#ID .er-ID-icon{fill:#552222;}#ID .er-ID-text{fill:#552222;stroke:#552222;}#ID .edge-thickness-normal{stroke-width:1px;}#ID .edge-thickness-thick{stroke-width:3.5px;}#ID .edge-pattern-solid{stroke-dasharray:0;}#ID .edge-thickness-invisible{stroke-width:0;fill:none;}#ID .edge-pattern-dashed{stroke-dasharray:3;}#ID .edge-pattern-dotted{stroke-dasharray:2;}#ID .marker{fill:#333333;stroke:#333333;}#ID .marker.cross{stroke:#333333;}#ID svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#ID p{margin:0;}#ID .packet-ID{font-size:10px;}#ID .packet-ID.start{fill:black;}#ID .packet-ID.end{fill:black;}#ID .packet-ID{fill:black;font-size:12px;}#ID .packet-ID{fill:black;font-size:14px;}#ID .packet-ID{stroke:black;stroke-width:1;fill:#efefef;}#ID .node .neo-node{stroke:#9370DB;}#ID [data-look="neo"].node rect,#ID [data-look="neo"].cluster rect,#ID [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#ID [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#ID [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID [data-look="neo"].node circle .state-ID{fill:#000000;}#ID [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID :root{--mermaid-ID-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g><rect x="1" y="15" width="507" height="32" class="packet-ID"></rect><text x="254.5" y="31" class="packet-ID" dominant-baseline="middle" text-anchor="middle">Source Port</text><text x="1" y="13" class="packet-ID start" dominant-baseline="auto" text-anchor="start">0</text><text x="508" y="13" class="packet-ID end" dominant-baseline="auto" text-anchor="end">15</text><rect x="513" y="15" width="507" height="32" class="packet-ID"></rect><text x="766.5" y="31" class="packet-ID" dominant-baseline="middle" text-anchor="middle">Dest Port</text><text x="513" y="13" class="packet-ID start" dominant-baseline="auto" text-anchor="start">16</text><text x="1020" y="13" class="packet-ID end" dominant-baseline="auto" text-anchor="end">31</text></g><text x="513" y="38.5" dominant-baseline="middle" text-anchor="middle" class="packet-ID"></text></svg>
