<svg id="ID" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 450"  role="graphics-document document" aria-roledescription="pie"><style>#ID{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#ID .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#ID .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#ID .er-ID-icon{fill:#552222;}#ID .er-ID-text{fill:#552222;stroke:#552222;}#ID .edge-thickness-normal{stroke-width:1px;}#ID .edge-thickness-thick{stroke-width:3.5px;}#ID .edge-pattern-solid{stroke-dasharray:0;}#ID .edge-thickness-invisible{stroke-width:0;fill:none;}#ID .edge-pattern-dashed{stroke-dasharray:3;}#ID .edge-pattern-dotted{stroke-dasharray:2;}#ID .marker{fill:#333333;stroke:#333333;}#ID .marker.cross{stroke:#333333;}#ID svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#ID p{margin:0;}#ID .pie-ID{stroke:black;stroke-width:2px;opacity:0.7;}#ID .pie-ID{stroke:black;stroke-width:2px;fill:none;}#ID .pie-ID{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#ID .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#ID .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#ID .node .neo-node{stroke:#9370DB;}#ID [data-look="neo"].node rect,#ID [data-look="neo"].cluster rect,#ID [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#ID [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#ID [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID [data-look="neo"].node circle .state-ID{fill:#000000;}#ID [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ID :root{--mermaid-ID-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pie-ID"></circle><path d="M0,-185A185,185,0,0,1,108.74,149.668L0,0Z" fill="#ECECFF" class="pie-ID"></path><path d="M108.74,149.668A185,185,0,1,1,0,-185L0,0Z" fill="#ffffde" class="pie-ID"></path><text transform="translate(131.95909163595255,-42.87610796952395)" style="text-anchor: middle" class="slice">40%</text><text transform="translate(-131.95909163595255,42.876107969523964)" style="text-anchor: middle" class="slice">60%</text><text x="0" y="-200" class="pie-ID">Vote</text><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: #ECECFF; stroke: #ECECFF"></rect><text x="22" y="14">A</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: #ffffde; stroke: #ffffde"></rect><text x="22" y="14">B</text></g></g></svg>
